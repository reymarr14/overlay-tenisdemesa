<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Tenis de Mesa</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:#fff}
  body.overlay{background:transparent;overflow:hidden}
  body.overlay #panel{display:none}
  body.panel #overlay{display:none}
  body.panel{background:#1b1d23;color:#e8e8e8;font-size:13px;padding:10px}

  /* ---------- OVERLAY ---------- */
  body.overlay #overlay{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  .frame{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
  .ticker{position:absolute;left:0;bottom:0;width:1920px;height:127px;overflow:hidden;display:flex;align-items:center;transition:opacity .4s}
  .ticker.hide{opacity:0}
  .tk-track{display:flex;flex:none;white-space:nowrap;will-change:transform}
  .tk-track span{font-family:"Barlow Condensed","Bahnschrift","Arial Narrow",Arial,sans-serif;font-weight:800;font-style:italic;
    font-size:56px;letter-spacing:1px;text-transform:uppercase;color:#fff;padding:0 30px}
  .tk-track i{color:#ffd400;font-style:normal;font-size:30px;align-self:center}
  @keyframes tk{to{transform:translateX(calc(-1 * var(--w)))}}
  .header{position:absolute;top:30px;left:50%;transform:translateX(-50%);padding:12px 44px;
    background:linear-gradient(90deg,#c8102e,#8b0a20);border-radius:10px;font-size:34px;font-weight:800;
    letter-spacing:2px;text-transform:uppercase;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.5);border-bottom:4px solid #fff}
  .board{position:absolute;width:640px;background:rgba(10,18,38,.92);border-radius:12px;overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.55);transition:opacity .4s}
  .board.hide{opacity:0}
  .cols,.row{display:grid;grid-template-columns:1fr 70px 90px}
  .cols{background:#1c2b52;font-size:15px;letter-spacing:1px;text-transform:uppercase;padding:6px 16px;color:#9fb3e0}
  .cols span:not(:first-child){text-align:center}
  .row{align-items:center;height:70px;padding:0 16px;border-top:1px solid rgba(255,255,255,.1)}
  .player{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .flag{width:54px;height:36px;object-fit:cover;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.4);flex:none}
  .flagtxt{width:54px;height:36px;border-radius:4px;background:#334;display:none;align-items:center;justify-content:center;font-size:16px;flex:none}
  .serve{width:14px;height:14px;border-radius:50%;background:#ffd400;flex:none;visibility:hidden;box-shadow:0 0 8px #ffd400}
  .serve.on{visibility:visible}
  .sets{text-align:center;font-size:34px;font-weight:800;color:#ffd400}
  .pts{text-align:center;font-size:42px;font-weight:900;background:#fff;color:#0a1226;height:100%;display:flex;align-items:center;justify-content:center}
  .row.lead .player{color:#ffd400}
  .history{padding:5px 16px;font-size:14px;color:#9fb3e0;background:#142041;min-height:20px}

  .slider{position:absolute;border-radius:14px;overflow:hidden;border:4px solid #fff;background:rgba(10,18,38,.6);
    box-shadow:0 4px 18px rgba(0,0,0,.55);transition:opacity .4s}
  .slider.hide{opacity:0}
  .slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}
  .slider img.on{opacity:1}

  /* ---------- PANEL ---------- */
  textarea{width:100%;box-sizing:border-box;font:inherit;border-radius:5px;border:1px solid #444;background:#2a2d36;color:#fff;padding:6px;height:70px;resize:vertical}
  h3{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#8fa3d6}
  input,select,button{font:inherit;border-radius:5px;border:1px solid #444;background:#2a2d36;color:#fff;padding:6px}
  input,select{width:100%;box-sizing:border-box}
  select option,select optgroup{background:#2a2d36;color:#fff}
  select optgroup{color:#ffd400;font-weight:700;font-style:normal}
  button{cursor:pointer;background:#3a4157}button:hover{background:#4a5370}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pl{background:#23262f;padding:8px;border-radius:8px}
  .pl label{display:block;margin:4px 0 2px;color:#aaa;font-size:11px}
  .big{font-size:24px;font-weight:800;text-align:center;padding:4px 0}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .plus{background:#1f8f4e}.plus:hover{background:#27ad60}
  .minus{background:#8f2a2a}.minus:hover{background:#b03636}
  .warn{background:#a8741a}
  .row2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.row2>*{flex:1}
  .dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,36px);gap:4px;justify-content:center}
  .dpad button{padding:0;font-size:16px}
</style>
</head>

<script>
const KEY='ttOverlayState';
const PANEL=/control|panel/.test(location.search+location.hash);
document.body.className=PANEL?'panel':'overlay';

const AM='ai ag ar aw bs bb bz bm bo br vg ca ky cl co cr cu cw dm do ec sv gd gt gy ht hn jm mx ms ni pa py pe pr kn lc vc sx sr tt tc us uy vi ve'.split(' ');
const ALL=('ad ae af ag ai al am ao ar as at au aw ax az ba bb bd be bf bg bh bi bj bm bn bo br bs bt bw by bz ca cc cd cf cg ch ci ck cl cm cn co cr cu cv cw cx cy cz de dj dk dm do dz ec ee eg eh er es et fi fj fk fm fo fr ga gb gd ge gf gg gh gi gl gm gn gp gq gr gt gu gw gy hk hn hr ht hu id ie il im in iq ir is it je jm jo jp ke kg kh ki km kn kp kr kw ky kz la lb lc li lk lr ls lt lu lv ly ma mc md me mg mh mk ml mm mn mo mp mq mr ms mt mu mv mw mx my mz na nc ne nf ng ni nl no np nr nu nz om pa pe pf pg ph pk pl pm pn pr ps pt pw py qa re ro rs ru rw sa sb sc sd se sg sh si sk sl sm sn so sr ss st sv sx sy sz tc td tg th tj tk tl tm tn to tr tt tv tw tz ua ug us uy uz va vc ve vg vi vn vu wf ws xk ye yt za zm zw gb-eng gb-sct gb-wls gb-nir').split(' ');
const OV={tw:'Taipéi Chino',hk:'Hong Kong',mo:'Macao',xk:'Kosovo','gb-eng':'Inglaterra','gb-sct':'Escocia','gb-wls':'Gales','gb-nir':'Irlanda del Norte'};
let DN=null;try{DN=new Intl.DisplayNames(['es'],{type:'region'})}catch(e){}
const nm=c=>{if(OV[c])return OV[c];try{return DN.of(c.toUpperCase())}catch(e){return c.toUpperCase()}};
const norm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function buildOpts(q=''){
  const mk=l=>l.map(c=>[c,nm(c)]).filter(([c,n])=>!q||norm(n).includes(q)||c===q)
    .sort((a,b)=>a[1].localeCompare(b[1],'es')).map(([c,n])=>`<option value="${c}">${n}</option>`).join('');
  const g=(t,l)=>{const o=mk(l);return o?'<optgroup label="'+t+'">'+o+'</optgroup>':''};
  const out=g('Américas',AM)+g('Resto del mundo',ALL.filter(c=>!AM.includes(c)));
  return q?(out||'<option value="">Sin resultados</option>'):'<option value="">—</option>'+out;
}
function fc(i){
  const s=document.getElementById('f'+i),prev=s.value,q=norm(document.getElementById('q'+i).value.trim());
  s.innerHTML=buildOpts(q);
  if(q){const f=[...s.options].find(o=>o.value);s.value=f?f.value:''}else s.value=prev;
}
const def=()=>({title:'ITTF Americas Championships Lima 2026',round:'',visible:true,server:0,
  players:[{name:'',flag:'pe'},{name:'',flag:'br'}],sets:[0,0],pts:[0,0],history:[],ver:2,pos:{a:'bl',x:40,y:255,s:1},slider:{on:true,sec:5,x:40,y:120,w:420},ticker:{on:true,speed:100,msgs:['Bienvenidos al ITTF Americas Championships Lima 2026']}});
const load=()=>{try{const v=JSON.parse(localStorage.getItem(KEY));if(!v)return def();const s=Object.assign(def(),v);if(s.ver!==2){s.pos=def().pos;s.ver=2}return s}catch(e){return def()}};
let S=load();
let bc=null;try{bc=new BroadcastChannel('tt')}catch(e){}

/* ---------- render del overlay ---------- */
function render(s){
  o_title.textContent=s.title; o_round.textContent=s.round||'';
  board.classList.toggle('hide',!s.visible);
  o_cur.textContent=s.sets[0]+s.sets[1]+1;
  [0,1].forEach(i=>{
    const r=document.getElementById('r'+i),p=s.players[i];
    r.querySelector('.name').textContent=p.name;
    r.querySelector('.sets').textContent=s.sets[i];
    r.querySelector('.pts').textContent=s.pts[i];
    r.querySelector('.serve').classList.toggle('on',s.server===i);
    r.classList.toggle('lead',s.pts[i]>s.pts[1-i]);
    const img=r.querySelector('.flag'),t=r.querySelector('.flagtxt');
    if(p.flag){
      const src='https://flagcdn.com/w160/'+p.flag.toLowerCase()+'.png';
      img.style.display='block';t.style.display='none';
      img.onerror=()=>{img.style.display='none';t.style.display='flex';t.textContent=p.flag.toUpperCase()};
      if(img.getAttribute('src')!==src)img.src=src;
    }else{img.style.display='none';t.style.display='none'}
  });
  o_hist.textContent=s.history.length?'Sets: '+s.history.join('  |  '):'';
  const p=s.pos,b=board.style;
  b.left=b.right=b.top=b.bottom='auto';
  b[p.a[1]=='l'?'left':'right']=p.x+'px';
  b[p.a[0]=='t'?'top':'bottom']=p.y+'px';
  b.transformOrigin=(p.a[0]=='t'?'top':'bottom')+' '+(p.a[1]=='l'?'left':'right');
  b.transform='scale('+p.s+')';
  renderSlider(s);
  renderTicker(s);
}

/* ---------- lógica del panel ---------- */
function push(){
  localStorage.setItem(KEY,JSON.stringify(S));
  if(bc)bc.postMessage(S);
  for(let i=0;i<2;i++){document.getElementById('s'+i).textContent=S.sets[i];document.getElementById('p'+i).textContent=S.pts[i]}
}
function applyInfo(){S.title=title.value;S.round=round.value;
  S.players[0]={name:n0.value.toUpperCase(),flag:f0.value};S.players[1]={name:n1.value.toUpperCase(),flag:f1.value};push()}
const pt=(i,d)=>{S.pts[i]=Math.max(0,S.pts[i]+d);push()};
const setw=(i,d)=>{S.sets[i]=Math.max(0,S.sets[i]+d);push()};
const srv=i=>{S.server=i;push()};
function closeSet(){
  if(S.pts[0]===S.pts[1])return;
  S.sets[S.pts[0]>S.pts[1]?0:1]++;S.history.push(S.pts[0]+'-'+S.pts[1]);S.pts=[0,0];push();
}
function swap(){
  S.players.reverse();S.sets.reverse();S.pts.reverse();S.server=1-S.server;
  S.history=S.history.map(h=>h.split('-').reverse().join('-'));fill();push();
}
const toggleVis=()=>{S.visible=!S.visible;push()};
function resetMatch(){if(confirm('¿Reiniciar el partido?')){S.sets=[0,0];S.pts=[0,0];S.history=[];push()}}
function mv(h,v){ // h: +1 derecha, v: +1 abajo (dirección en pantalla)
  const st=+step.value,p=S.pos;
  p.x+= (p.a[1]=='l'?h:-h)*st;
  p.y+= (p.a[0]=='t'?v:-v)*st;
  push();
}
function corner(a){S.pos.a=a;S.pos.x=40;S.pos.y=a[0]=='t'?130:(a=='bl'?255:145);push()}
function scale(d){S.pos.s=Math.min(2,Math.max(.4,+(S.pos.s+d).toFixed(2)));push()}
function fill(){[0,1].forEach(i=>{const q=document.getElementById('q'+i);if(q&&q.value){q.value='';document.getElementById('f'+i).innerHTML=buildOpts()}});title.value=S.title;round.value=S.round;n0.value=S.players[0].name;n1.value=S.players[1].name;f0.value=S.players[0].flag;f1.value=S.players[1].flag}

/* ---------- slider ---------- */
const PH='ttPhotos',UPK='ttPhotosUp';
const rd=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
let sTimer=null,sSig='',sCur=0,sIdx=0;
function renderSlider(s){
  const el=slider,c=s.slider,imgs=el.querySelectorAll('img'),list=rd(PH);
  el.style.right=c.x+'px';el.style.top=c.y+'px';el.style.width=c.w+'px';el.style.height=Math.round(c.w*0.625)+'px';
  el.classList.toggle('hide',!c.on||!list.length);
  const sig=list.length+'|'+c.sec+'|'+(list[0]||'').length+'|'+(list[list.length-1]||'').length;
  if(sig===sSig)return;
  sSig=sig;clearInterval(sTimer);sIdx=0;
  if(!list.length)return;
  const show=()=>{const n=imgs[1-sCur];n.src=list[sIdx%list.length];n.classList.add('on');imgs[sCur].classList.remove('on');sCur=1-sCur;sIdx++};
  show();
  if(list.length>1)sTimer=setInterval(show,c.sec*1000);
}
function sl(k){S.slider[k]=!S.slider[k];push()}
function mvS(h,v){const st=+step.value,c=S.slider;
  if(!h&&!v){c.x=40;c.y=120;c.w=420}else{c.x-=h*st;c.y+=v*st}push()}
const sizeS=d=>{S.slider.w=Math.min(900,Math.max(200,S.slider.w+d));push()};
function savePhotos(){
  const urls=photoUrls.value.split('\n').map(t=>t.trim()).filter(Boolean);
  try{localStorage.setItem(PH,JSON.stringify(urls.concat(rd(UPK))))}catch(e){alert('Sin espacio de almacenamiento')}
  photoInfo.textContent=urls.length+' URL(s) · '+rd(UPK).length+' subida(s)';
}
async function addFiles(files){
  const up=rd(UPK);
  for(const f of files){
    try{
      const bm=await createImageBitmap(f),k=Math.min(1,1000/bm.width),cv=document.createElement('canvas');
      cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);
      cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
      up.push(cv.toDataURL('image/jpeg',.8));
    }catch(e){}
  }
  try{localStorage.setItem(UPK,JSON.stringify(up))}catch(e){alert('Sin espacio: sube menos fotos');return}
  savePhotos();
}
function clearPhotos(){if(!confirm('¿Quitar todas las fotos?'))return;
  localStorage.setItem(UPK,'[]');localStorage.setItem(PH,'[]');photoUrls.value='';photoInfo.textContent='Sin fotos'}
function initPhotos(){
  const all=rd(PH),up=rd(UPK);
  photoUrls.value=all.filter(x=>!up.includes(x)).join('\n');sec.value=S.slider.sec;
  photoInfo.textContent=(all.length-up.length)+' URL(s) · '+up.length+' subida(s)';
}

/* ---------- ticker ---------- */
let tkSig='';
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function renderTicker(s){
  const t=s.ticker,tr=tkTrack;
  ticker.classList.toggle('hide',!t.on||!t.msgs.length);
  const sig=t.speed+'|'+t.msgs.join('|');
  if(sig===tkSig)return;tkSig=sig;
  if(!t.msgs.length){tr.innerHTML='';return}
  const unit=t.msgs.map(m=>'<span>'+esc(m)+'</span><i>◆</i>').join('');
  tr.style.animation='none';tr.innerHTML=unit;
  const w=tr.scrollWidth,k=Math.ceil(1920/w)+1;
  tr.innerHTML=unit.repeat(k);
  tr.style.setProperty('--w',w+'px');
  tr.style.animation='tk '+(w/t.speed)+'s linear infinite';
}
const tk=k=>{S.ticker[k]=!S.ticker[k];push()};
function saveTicker(){S.ticker.msgs=tkMsgs.value.split('\n').map(x=>x.trim()).filter(Boolean);push()}
function initTicker(){tkMsgs.value=S.ticker.msgs.join('\n');tkSpeed.value=S.ticker.speed}

/* ---------- arranque ---------- */
if(PANEL){
  const opts=buildOpts();
  f0.innerHTML=f1.innerHTML=opts;fill();initPhotos();initTicker();push();
}else{
  const fit=()=>{overlay.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'};
  fit();addEventListener('resize',fit);
  render(S);
  if(document.fonts)document.fonts.ready.then(()=>{tkSig='';renderTicker(S)});
  const upd=()=>{S=load();render(S)};
  addEventListener('storage',e=>{if(e.key===KEY)upd()});
  if(bc)bc.onmessage=e=>{S=e.data;render(S)};
  setInterval(upd,1000);
}
</script>
